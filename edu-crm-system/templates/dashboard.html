{% extends "base.html" %}

{% block content %}
<div class="dashboard">
    <h2>Панель администратора</h2>
    
    <div class="stats-grid">
        <div class="stat-card">
            <h3>{{ users_count }}</h3>
            <p>Всего пользователей</p>
        </div>
        <div class="stat-card">
            <h3>{{ courses_count }}</h3>
            <p>Курсов</p>
        </div>
        <div class="stat-card">
            <h3>{{ students_count }}</h3>
            <p>Студентов</p>
        </div>
    </div>

    <div class="dashboard-actions">
        <a href="{{ url_for('create_course') }}" class="btn btn-primary">Создать курс</a>
        <a href="{{ url_for('courses') }}" class="btn btn-secondary">Управление курсами</a>
    </div>
</div>
{% endblock %}
